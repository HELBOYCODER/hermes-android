name: android
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:testDebugUnitTest --stacktrace
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: hermes-debug, path: app/build/outputs/apk/debug/*.apk }
      - name: Publish Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "Hermes Android v1.3.0 — Full Minis UI Clone"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Hermes Android v1.3.0 (Full Minis UI Clone)
            - **Full Minis shell**: Chat, Models, Terminal, Stats and More navigation with compact dark surfaces.
            - **Minis visual language across every screen**: providers, chat, tools, cron, gateway, memory, skills, terminal, dashboard, settings and setup.
            - **Obsidian + Emerald/Cyan theme** with active pills, status badges, compact cards, empty states and mobile-safe spacing.
            - **No feature changes**: this release is a UI-only clone layer on Hermes capabilities.
