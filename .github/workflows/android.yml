name: android
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:testDebugUnitTest --stacktrace
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: hermes-debug, path: app/build/outputs/apk/debug/*.apk }
      - name: Publish Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Hermes Android v1.2.0 — Minis Provider Suite"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Hermes Android v1.2.0 (Minis Provider Suite)
            - **Exact Minis Provider Design**: Monogram avatars, status pills, latency ping tester, and provider instance cards.
            - **Unlimited Model Binding**: Add any custom model ID without restrictions, with context window overrides.
            - **Full Minis Provider Presets**: OpenAI, Anthropic, OpenRouter, Local 9Router, Ollama, and Custom Endpoints.
            - **Live Endpoint Model Discovery**: Auto-fetch all models directly from `/v1/models` in one tap.
            - **Seamless Termux Auto-Link**: Probes local ports (8765, 20128, 11434, 9119) and links them on the fly.
            - **Obsidian & Emerald Visual Theme**: Dark-first palette inspired by Open Minis.
