name: android
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:testDebugUnitTest --stacktrace
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: hermes-debug, path: app/build/outputs/apk/debug/*.apk }
      - name: Publish Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Hermes Android v1.1.0"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Hermes Android v1.1.0
            - **Free Model & Provider Integration**: Connect freely to OpenAI, Anthropic, Google Gemini, OpenRouter, Ollama, Termux 9Router, and arbitrary custom endpoints.
            - **No Model Limits**: Add and switch to ANY custom model identifier on the fly.
            - **Termux Auto-Detection**: Live probing of Termux loopback services (8765, 9119, 20128, 11434) and seamless linking.
            - **Open Minis-Inspired Aesthetic**: Modern obsidian slate dark surfaces with vibrant emerald green & electric cyan accents.
            - **Quick Model Selector Pill**: Switch active models across all providers instantly from the chat top bar.
            - **Multi-Format SSE Streaming**: Unified stream parser supporting Hermes Gateway and standard OpenAI streaming events.
